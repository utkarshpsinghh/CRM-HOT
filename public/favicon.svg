<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Shield -->
  <path d="M 50,5 Q 85,5 88,35 Q 88,72 50,95 Q 12,72 12,35 Q 15,5 50,5 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)"/>
  
  <!-- Inner Shield -->
  <path d="M 50,10 Q 80,10 82,37 Q 82,68 50,89 Q 18,68 18,37 Q 20,10 50,10 Z" 
        fill="url(#shieldGrad)" stroke="#fef08a" stroke-width="1.5"/>

  <!-- Crossed Swords (Backing) -->
  <!-- Sword 1 -->
  <path d="M 28,26 L 72,74 M 25,23 L 31,29 M 22,20 L 26,24" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
  <!-- Sword 2 -->
  <path d="M 72,26 L 28,74 M 75,23 L 69,29 M 78,20 L 74,24" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Crown on Top -->
  <path d="M 33,40 L 30,52 L 70,52 L 67,40 L 58,47 L 50,34 L 42,47 Z" 
        fill="url(#goldGrad)" stroke="#854d0e" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- Fire / Flame in Center -->
  <path d="M 50,55 C 44,62 44,70 50,76 C 56,70 56,62 50,55 Z" 
        fill="#f97316"/>
  <path d="M 50,60 C 47,65 47,70 50,73 C 53,70 53,65 50,60 Z" 
        fill="#fef08a"/>

  <!-- Text "HOT" -->
  <text x="50" y="50" font-family="'Cinzel', serif, fantasy" font-weight="900" font-size="12" 
        fill="#fef08a" text-anchor="middle" letter-spacing="1">HOT</text>
</svg>